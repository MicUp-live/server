services:
  # LocalStack supplies the AWS-managed services used by the API and workers
  # (S3, SQS, and SES) without creating or touching an AWS account resource.
  localstack:
    image: localstack/localstack:3.8.1
    container_name: micup-localstack
    restart: unless-stopped
    environment:
      AWS_DEFAULT_REGION: us-east-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SERVICES: s3,sqs,ses
      DEBUG: "0"
      PERSISTENCE: "1"
      LS_LOG: warning
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      - ./scripts/local/localstack-init.sh:/etc/localstack/init/ready.d/10-micup-bootstrap.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4566/_localstack/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # PostgreSQL 16 provides local development and test parity for the
  # Aurora DSQL-compatible relational store (PG1).
  postgres:
    image: postgres:16-alpine
    container_name: micup-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: micup
      POSTGRES_USER: micup
      POSTGRES_PASSWORD: micup-local-password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U micup -d micup"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  localstack_data:
  postgres_data:

networks:
  default:
    name: micup-local
