services:
  # DynamoDB Local is kept separate from LocalStack because its transaction and
  # table/index behavior is closer to the production DynamoDB API than a
  # second emulation layer, and it is already the local persistence contract.
  dynamodb:
    image: amazon/dynamodb-local:2.6.1
    container_name: micup-dynamodb
    user: "0:0"
    restart: unless-stopped
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - dynamo_data:/home/dynamodblocal/data
    healthcheck:
      # DynamoDB Local answers a bare GET with HTTP 400 because it expects an
      # operation payload; a successful curl connection is the useful probe.
      test: ["CMD-SHELL", "curl -sS http://127.0.0.1:8000 >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # LocalStack supplies the AWS-managed services used by the API and workers
  # (S3, SQS, and SES) without creating or touching an AWS account resource.
  localstack:
    image: localstack/localstack:3.8.1
    container_name: micup-localstack
    restart: unless-stopped
    environment:
      AWS_DEFAULT_REGION: us-east-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SERVICES: s3,sqs,ses
      DEBUG: "0"
      PERSISTENCE: "1"
      LS_LOG: warning
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      - ./scripts/local/localstack-init.sh:/etc/localstack/init/ready.d/10-micup-bootstrap.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4566/_localstack/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  dynamo_data:
  localstack_data:

networks:
  default:
    name: micup-local
