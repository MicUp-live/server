        '401':
          description: Invalid PIN
        '403':
          description: PIN not configured by host
  /events/{id}/queue:
    get:
      tags:
      - Queue
      summary: Poll live queue (conditional)
      description: Returns 204 No Content with zero bytes if queue_version == since.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: since
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: Queue has updates
          headers:
            X-Queue-Version:
              description: Monotonic queue version for this snapshot
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueResponse'
        '204':
          description: No updates since specified version
          headers:
            X-Queue-Version:
              description: Current queue version
              schema:
                type: integer
  /events/{id}/requests:
    get:
      tags:
      - Queue
      summary: Get queue requests (Host view)
      security:
      - DeveloperKeyAuth: []
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: since
        in: query
        description: Return 204 when this queue version is still current.
        schema:
          type: integer
      responses:
        '200':
          description: Complete host queue snapshot
          headers:
            X-Queue-Version:
              description: Monotonic queue version for this snapshot
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostQueueResponse'
        '204':
          description: No updates since the requested queue version
          headers:
            X-Queue-Version:
              description: Current queue version
              schema:
                type: integer
        '403':
          $ref: '#/components/responses/InsufficientScope'
    post:
      tags:
      - Queue
      summary: Submit singer request
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRequest'
      responses:
        '201':
          description: Request submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Max active limit reached, show paused, or admission changed during retries
  /events/{id}/requests/{rid}:
    get:
      tags:
      - Queue
      summary: Get single request status
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: rid
        in: path
        required: true
        schema:
          type: string
      - name: cancel_token
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Request details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Queue
      summary: Update request status
      security:
      - DeveloperKeyAuth: []
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: rid
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        description: Optional UUID retained across retries of this mutation.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStatusRequest'
      responses:
        '200':
          description: Request updated
          headers:
            X-Queue-Version:
              description: Queue version after this conditional mutation.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '409':
          $ref: '#/components/responses/QueueMutationConflict'
    delete:
      tags:
      - Queue
      summary: Cancel request
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: rid
        in: path
        required: true
        schema:
          type: string
      - name: cancel_token
        in: query
        schema:
          type: string
      responses:
        '204':
          description: Request cancelled
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Valid cancellation token or host ownership required
        '404':
          description: Request not found in the event; repeated deletion also returns 404
        '500':
          description: Request lookup or deletion failed
  /events/{id}/requests/{rid}/song:
    patch:
      tags:
      - Queue
      summary: Replace queued song before being called
      description: Allows a singer holding the request's domain-separated edit_token to swap their queued song while the request is still pending or accepted, preserving request ID, rank, round, and rotation slot.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: rid
        in: path
        required: true
        schema:
          type: string
      - name: X-Edit-Token
        in: header
        required: true
        description: Domain-separated edit capability token issued when the request was created (cancel tokens are rejected).
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceRequestSong'
      responses:
        '200':
          description: Request song replaced in place
          headers:
            X-Queue-Version:
              description: Queue version after replacement.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Missing/invalid edit token, song replacement disabled, or write-ins disabled
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Request already called to stage or finalized, or queue changed concurrently
        '410':
          description: Show has ended
  /events/{id}/requests/{rid}/defer:
    post:
      tags:
      - Queue
      summary: Defer absent singer down the active queue
      description: Explicitly bumps an active or called singer down 3 positions (or to the end of the active queue if fewer remain) without recording a completed performance. Called (up_next) singers return to accepted status.
      security:
      - DeveloperKeyAuth: []
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: rid
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        description: Optional UUID retained across retries so network retries never defer twice.
        schema:
          type: string
          format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expected_queue_version:
                  type: integer
                  minimum: 0
      responses:
        '200':
          description: Request deferred
          headers:
            X-Queue-Version:
              description: Queue version after deferral.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/QueueMutationConflict'
  /events/{id}/requests/reorder:
    post:
      tags:
      - Queue
      summary: Reorder queue requests
      security:
      - DeveloperKeyAuth: []
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        description: Optional UUID retained across retries of this mutation.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderRequests'
      responses:
        '200':
          description: Queue reordered successfully
          headers:
            X-Queue-Version:
              description: Queue version after this conditional mutation.
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    example: ok
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '409':
          $ref: '#/components/responses/QueueMutationConflict'
  /api-keys:
    get:
      tags:
      - API Keys
      summary: List API keys
      security:
      - BearerAuth: []
      responses:
        '200':
          description: List of developer keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeveloperKey'
    post:
      tags:
      - API Keys
      summary: Create an API key
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKeyRequest'
      responses:
        '201':
          description: Key created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyResponse'
  /api-keys/{id}:
    delete:
      tags:
      - API Keys
      summary: Revoke an API key
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Key revoked successfully
  /openkj/api.php:
    get:
      tags:
      - OpenKJ
      summary: OpenKJ Protocol Dispatcher (GET)
      security:
      - OpenKJKeyAuth: []
      parameters:
      - name: action
        in: query
        required: true
        schema:
          type: string
          enum:
          - getvenues
          - getserial
          - setaccepting
          - getrequests
          - deleterequest
          - clearrequests
      - name: key
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OpenKJ protocol response
    post:
      tags:
      - OpenKJ
      summary: OpenKJ Protocol Dispatcher (POST)
      security:
      - OpenKJKeyAuth: []
      parameters:
      - name: action
        in: query
        required: true
        schema:
          type: string
          enum:
          - addsongs
          - cleardatabase
          - setaccepting
          - getrequests
          - deleterequest
          - clearrequests
      - name: key
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OpenKJ protocol response
        '500':
          description: OpenKJ mutation failed
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Session JWT obtained via /auth/login or /auth/passkey/login-verify.
    DeveloperKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: mk_live_[hex]
      description: 'Personal Access Token generated in KJ Host Settings (Authorization:
        Bearer mk_live_...).'
    CancelTokenAuth:
      type: apiKey
      in: query
      name: cancel_token
      description: Cryptographic HMAC-SHA256 token issued on song request creation.
    OpenKJKeyAuth:
      type: apiKey
      in: query
      name: key
      description: Event-scoped integration key in format okj_<event_id>_<secret>.
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          example: usr_01h8bc4a9
        email:
          type: string
          format: email
          example: host@venue.com
        display_name:
          type: string
          example: KJ Dave
        is_host:
          type: boolean
          example: true
        email_verified:
          type: boolean
          example: true
        avatar_url:
          type: string
          nullable: true
          example: https://...
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        favorite_songs:
          type: array
          items:
            $ref: '#/components/schemas/FavoriteSong'
        favorite_artists:
          type: array
          items:
            $ref: '#/components/schemas/FavoriteArtist'
    FavoriteSong:
      type: object
      required:
      - artist
      - title
      - preferred_key
      - added_at
      properties:
        artist:
          type: string
          example: Queen
        title:
          type: string
          example: Bohemian Rhapsody
        preferred_key:
          type: integer
          minimum: -6
          maximum: 6
          default: 0
          example: 0
        canonical_id:
          type: string
          example: c1a2b3
        added_at:
          type: integer
          format: int64
          description: Timestamp in milliseconds since Unix epoch
          example: 1700000000000
    FavoriteArtist:
      type: object
      required:
      - name
      - added_at
      properties:
        name:
          type: string
          example: Queen
        added_at:
          type: integer
          format: int64
          description: Timestamp in milliseconds since Unix epoch
          example: 1700000000000
    UserFavorites:
      type: object
      required:
      - songs
      - artists
      properties:
        songs:
          type: array
          items:
            $ref: '#/components/schemas/FavoriteSong'
        artists:
          type: array
          items:
            $ref: '#/components/schemas/FavoriteArtist'
    RegisterRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          example: host@venue.com
        password:
          type: string
          minLength: 8
          example: correct-horse-battery-staple
        display_name:
          type: string
          example: KJ Dave
        is_host:
          type: boolean
          default: true
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          example: host@venue.com
        password:
          type: string
          example: secret123
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
          example: eyJhbGciOi...
        user:
          $ref: '#/components/schemas/User'
    UpdateProfileRequest:
      type: object
      properties:
        display_name:
          type: string
          example: Dave The Wave
        email:
          type: string
          format: email
          example: new@venue.com
        avatar_url:
          type: string
          example: https://...
        is_host:
          type: boolean
        password:
          type: string
          minLength: 8
    PasswordResetRequest:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          format: email
          example: host@venue.com
    PasswordResetConfirmRequest:
      type: object
      required:
      - token
      - password
      properties:
        token:
          type: string
          example: hmac_token_here
        password:
          type: string
          minLength: 8
          example: newpassword123
    PasskeyInfo:
      type: object
      properties:
        id:
          type: string
          example: cred_01h8x9
        friendly_name:
          type: string
          example: MacBook Touch ID
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
    Songbook:
      type: object
      properties:
        id:
          type: string
          example: sb_01h891ab3
        public_id:
          type: string
          example: pub_01h891ab3
        owner_id:
          type: string
          example: usr_01h8bc4a9
        venue_id:
          type: string
