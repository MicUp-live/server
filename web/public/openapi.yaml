      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
      responses:
        '201':
          description: Event created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientScope'
  /events/{id}:
    get:
      tags:
      - Events
      summary: Get event details (Host view)
      security:
      - DeveloperKeyAuth: []
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Event details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Events
      summary: Update event settings
      description: |
        The server loads the current event and conditionally commits the supplied
        fields. A concurrent queue or event-metadata change returns 409 without
        applying this update; reload event/queue state before resubmitting the
        intended fields. Unrelated fields from an older server snapshot cannot
        overwrite newer lifecycle, rotation, retention, or integration-key state.
      security:
      - DeveloperKeyAuth: []
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Event updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '409':
          $ref: '#/components/responses/EventMutationConflict'
    delete:
      tags:
      - Events
      summary: Delete event
      security:
      - DeveloperKeyAuth: []
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Event deleted
  /events/{id}/pause:
    post:
      tags:
      - Events
      summary: Pause singer requests
      security:
      - DeveloperKeyAuth: []
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Event paused successfully
        '409':
          $ref: '#/components/responses/EventMutationConflict'

  /events/{id}/resume:
    post:
      tags:
      - Events
      summary: Resume singer requests
      security:
      - DeveloperKeyAuth: []
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
