openapi: 3.0.3
info:
  title: MicUp.live API
  description: "Complete REST API specification for MicUp.live \u2014 covering Singers,\
    \ Hosts, Kiosks, Third-Party Developers, and OpenKJ Desktop integration.\n\n###\
    \ Authentication Schemes\n- **Bearer JWT**: Standard host session token issued\
    \ via `/auth/login` or passkeys (`Authorization: Bearer <jwt>`).\n- **Developer\
    \ PAT**: Personal Access Token issued in Host Settings (`Authorization: Bearer\
    \ mk_live_<hex>`).\n- **Refresh Cookie**: HTTP-only `micup_refresh` cookie used\
    \ for token rotation.\n- **Cancellation Token**: Cryptographic HMAC token issued\
    \ on request creation (`?cancel_token=...`).\n- **OpenKJ Key**: Event-scoped integration\
    \ key (`okj_<event_id>_<secret>`).\n\n### Real-Time Queue Polling\nSinger queue\
    \ polling uses monotonic conditional requests (`?since={version}`). When the queue\
    \ has not changed, the server returns **`HTTP 204 No Content`** with zero body\
    \ bytes."
  version: 1.0.0
  contact:
    name: MicUp.live Support
    url: https://micup.live/docs
servers:
- url: https://micup.live/api/v1
  description: Production API Server
- url: http://localhost:8080/api/v1
  description: Local Development Server
tags:
- name: System
  description: Health and operational status.
- name: Authentication
  description: Host account registration, session tokens, and password reset.
- name: Passkeys
  description: FIDO2 / WebAuthn biometric passkey registration and login.
- name: Privacy
  description: GDPR compliance, data export snapshots, and account deletion.
- name: Songbooks
  description: Songbook CRUD and venue association.
- name: Songs
  description: Track creation, batch deletion, bulk upsert, and filename parsing.
- name: Catalog & Manifests
  description: Static content-addressed catalog shards and overrides.
- name: Imports
  description: Background CSV/TSV import jobs and S3 presigned uploads.
- name: Events
  description: Live karaoke shows, show codes, pause/resume, and settings.
- name: Join & Kiosk
  description: Short show code lookup and constant-time kiosk PIN verification.
- name: Queue
  description: Real-time singer queue submissions, status management, and bump reordering.
- name: API Keys
  description: Personal Access Tokens for developer integrations.
- name: OpenKJ
  description: OpenKJ request-server compatibility protocol adapter.
paths:
  /healthz:
    get:
      tags:
      - System
      summary: Health check
      responses:
        '204':
          description: Service is healthy
  /auth/register:
    post:
      tags:
      - Authentication
      summary: Register host account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created and logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/login:
    post:
      tags:
      - Authentication
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/refresh:
    post:
      tags:
      - Authentication
      summary: Refresh session access token
      responses:
        '200':
          description: Session refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/favorites:
    get:
      tags:
      - Authentication
      summary: Get user favorites
      description: Returns the authenticated user's account-synced favorite songs and artists.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: User favorites
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserFavorites'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags:
      - Authentication
      summary: Update user favorites
      description: Validates, normalizes, deduplicates, and replaces the authenticated user's favorite songs and artists.
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserFavorites'
      responses:
        '200':
          description: Saved user favorites
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserFavorites'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me:
    get:
      tags:
      - Authentication
      summary: Get authenticated user profile
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags:
      - Authentication
      summary: Update user profile
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
      - Privacy
      summary: Delete account (GDPR erasure)
      description: |
        Permanently deletes the authenticated account and all owned resources
        (sessions, passkeys, developer keys, events, requests, songbooks, import
        jobs, and unreferenced catalog versions). Shared catalog versions
        referenced by other accounts are preserved.

        Deletion begins by durably fencing the account (`deleting = true`) and
        revoking all authentication credentials. If a later cascade step fails,
        the server returns HTTP 500 with `X-Deletion-Token` and a JSON recovery
        summary (`step`, `deleting`, `deletion_token`). Retries may authenticate
        with `X-Deletion-Token` (or `Authorization: Bearer <deletion_token>`)
        after session/passkey/password credentials have been revoked. Repeated
        deletion after completion is idempotent (`204 No Content`).
      security:
      - BearerAuth: []
      parameters:
      - name: X-Deletion-Token
        in: header
        required: false
        description: Scoped deletion recovery token returned by a prior interrupted `DELETE /auth/me` attempt.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
      responses:
        '204':
          description: Account and all associated resources permanently deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Cross-account deletion token mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/AccountDeletionIncomplete'
  /auth/logout:
    post:
      tags:
      - Authentication
      summary: Log out and revoke sessions
      security:
      - BearerAuth: []
      responses:
        '204':
          description: Logged out successfully
  /auth/me/export:
    get:
      tags:
      - Privacy
      summary: Export complete personal data snapshot
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Structured JSON archive of all user data
  /auth/verify-email/request:
    post:
      tags:
      - Authentication
      summary: Request email verification link
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Verification link sent
  /auth/verify-email/confirm:
    post:
      tags:
      - Authentication
      summary: Confirm email address verification
      parameters:
      - name: token
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Email verified successfully
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/forgot-password:
    post:
      tags:
      - Authentication
      summary: Request password reset email
      description: Returns the same neutral response for unknown accounts and delivery failures; HTTP 200 does not certify email delivery.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: Reset email request accepted (neutral message)
  /auth/reset-password:
    post:
      tags:
      - Authentication
      summary: Confirm password reset and set new password
      description: |
        A reset link expires after one hour. A successful reset atomically replaces
        the password and invalidates all previously issued reset links and bearer
        access/refresh sessions for the account. Existing passkeys, developer keys,
        and OpenKJ credentials remain separate authorities. Concurrent or repeated
        use of an invalidated link returns 400. A storage failure returns 500;
        retry may succeed if the first attempt did not commit. After an ambiguous
        response, a consumed link returns 400; sign in with the new password or
        request a fresh link. The refresh cookie is cleared on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '200':
          description: Password reset completed
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          description: Password replacement could not be completed
  /auth/passkey/register-options:
    post:
      tags:
      - Passkeys
      summary: Generate WebAuthn registration options
      responses:
        '200':
          description: WebAuthn creation challenge
  /auth/passkey/register-verify:
    post:
      tags:
      - Passkeys
      summary: Verify WebAuthn attestation and register passkey
      responses:
        '201':
          description: Passkey registered and session issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
  /auth/passkey/login-options:
    post:
      tags:
      - Passkeys
      summary: Generate WebAuthn login assertion options
      responses:
        '200':
          description: WebAuthn assertion challenge
  /auth/passkey/login-verify:
    post:
      tags:
      - Passkeys
      summary: Verify WebAuthn assertion and log in
      responses:
        '200':
          description: Passkey login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: The assertion was rejected or the credential is no longer valid for this login.
        '500':
          description: Login could not complete because credential storage failed.
  /auth/passkeys:
    get:
      tags:
      - Passkeys
      summary: List user passkeys
      security:
      - BearerAuth: []
      responses:
        '200':
          description: User passkeys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PasskeyInfo'
  /auth/passkeys/{id}:
    delete:
      tags:
      - Passkeys
      summary: Delete a registered passkey
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Passkey removed
  /songbooks:
    get:
      tags:
      - Songbooks
      summary: List host songbooks
      security:
      - BearerAuth: []
      - DeveloperKeyAuth: []
      responses:
        '200':
          description: List of songbooks
          content:
            application/json:
              schema:
                type: object
                properties:
                  songbooks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Songbook'
    post:
      tags:
      - Songbooks
      summary: Create a new songbook
      security:
      - BearerAuth: []
      - DeveloperKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSongbookRequest'
      responses:
        '201':
          description: Songbook created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Songbook'
  /songbooks/{id}:
    get:
      tags:
      - Songbooks
      summary: Get songbook details
      security:
      - BearerAuth: []
      - DeveloperKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Songbook details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Songbook'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Songbooks
      summary: Update songbook metadata
      security:
      - BearerAuth: []
      - DeveloperKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Songbook updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Songbook'
    delete:
      tags:
      - Songbooks
      summary: Delete songbook
      security:
      - BearerAuth: []
      - DeveloperKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: confirm_detach_token
        in: query
        required: false
        description: Confirmation token returned by a prior 409 foreign_events_associated response to end and detach collaborator shows before deletion.
        schema:
          type: string
      responses:
        '204':
          description: Songbook deleted
        '403':
          description: Caller is not the songbook owner
        '409':
          description: Blocked by owner's own linked event or requires confirmation to end and detach collaborator shows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForeignEventsAssociatedError'
  /songbooks/{id}/access:
    get:
      tags:
      - Songbooks
      summary: List accepted collaborators and pending invitations (owner host session only)
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Access overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SongbookAccessOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
        '404':
          description: Songbook not found
  /songbooks/{id}/invitations:
    post:
      tags:
      - Songbooks
      summary: Create and send a songbook collaboration invitation (owner host session only)
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
                can_edit_catalog:
                  type: boolean
                can_host_shows:
                  type: boolean
      responses:
        '201':
          description: Invitation created (remains pending if email delivery failed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  invitation:
                    $ref: '#/components/schemas/SongbookInvitation'
                  delivery_failed:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          description: Rate limit exceeded
  /songbooks/{id}/invitations/{invitationID}/resend:
    post:
      tags:
      - Songbooks
      summary: Rotate single-use link and resend pending invitation (owner host session only)
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: invitationID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Invitation resent with a fresh link (previous link invalidated)
          content:
            application/json:
              schema:
                type: object
                properties:
                  invitation:
                    $ref: '#/components/schemas/SongbookInvitation'
                  delivery_failed:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
        '404':
          description: Invitation not found
        '410':
          description: Invitation is no longer pending
        '429':
          description: Rate limit exceeded
  /songbooks/{id}/invitations/{invitationID}:
    delete:
      tags:
      - Songbooks
      summary: Cancel a pending invitation (owner host session only)
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: invitationID
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Invitation canceled
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
        '404':
          description: Invitation not found
        '410':
          description: Invitation is no longer pending
  /songbooks/{id}/members/{userID}:
    patch:
      tags:
      - Songbooks
      summary: Update collaborator permissions (owner host session only)
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: userID
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                can_edit_catalog:
                  type: boolean
                can_host_shows:
                  type: boolean
      responses:
        '200':
          description: Grant updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
        '404':
          description: Member not found
    delete:
      tags:
      - Songbooks
      summary: Revoke collaborator access (owner host session only)
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: userID
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Access revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
        '404':
          description: Member not found
  /songbook-invitations/preview:
    get:
      tags:
      - Songbooks
      summary: Preview a single-use songbook collaboration invitation
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Invitation preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SongbookInvitationPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Invitation not found or invalidated
        '410':
          description: Invitation expired or no longer valid
  /songbook-invitations/accept:
    post:
      tags:
      - Songbooks
      summary: Accept a single-use songbook collaboration invitation (verified host session required)
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Invitation accepted and collaborator grant created
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Wrong email, unverified email, or non-host account
        '404':
          description: Invitation not found or invalidated
        '410':
          description: Invitation expired, canceled, replaced, or already accepted
  /songbooks/{id}/songs:
    get:
      tags:
      - Songs
      summary: List songs in songbook
      security:
      - BearerAuth: []
      - DeveloperKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: q
        in: query
        schema:
          type: string
      responses:
        '200':
          description: List of songs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Song'
    post:
      tags:
      - Songs
      summary: Add single song
      security:
      - BearerAuth: []
      - DeveloperKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSongRequest'
      responses:
        '201':
          description: Song added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Song'
  /songbooks/{id}/songs/{songID}:
    get:
      tags:
      - Songs
      summary: Get a managed song with host-only metadata (including original file location)
      security:
      - BearerAuth: []
      - DeveloperKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: songID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Song details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Song'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Song not found
    patch:
      tags:
      - Songs
      summary: Update a song
      security:
      - BearerAuth: []
      - DeveloperKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: songID
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSongRequest'
      responses:
        '200':
          description: Song updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Song'
    delete:
      tags:
      - Songs
      summary: Delete a song
      security:
      - BearerAuth: []
      - DeveloperKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: songID
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Song deleted
  /songbooks/{id}/songs/batch-delete:
    post:
      tags:
      - Songs
      summary: Batch delete songs
      security:
      - BearerAuth: []
      - DeveloperKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Songs deleted
  /songbooks/{id}/songs/clear:
    post:
      tags:
      - Songs
      summary: Clear all songs in songbook
      security:
      - BearerAuth: []
      - DeveloperKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: All songs removed
  /songbooks/{id}/parse-files:
    post:
      tags:
      - Songs
      summary: Parse filename list into track candidates
      security:
      - BearerAuth: []
      - DeveloperKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParseFilesRequest'
      responses:
        '200':
          description: Parsed track candidates
  /songbooks/{id}/managed-manifest:
    get:
      tags:
      - Catalog & Manifests
      summary: Get managed catalog manifest (Host)
      security:
      - BearerAuth: []
      - DeveloperKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Managed manifest
  /songbooks/{id}/catalog-overrides:
    get:
      tags:
      - Catalog & Manifests
      summary: Get catalog overrides (Host)
      security:
      - BearerAuth: []
      - DeveloperKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: List of catalog overrides
  /songbooks/{id}/public-manifest:
    get:
      tags:
      - Catalog & Manifests
      summary: Get public catalog manifest for singer app
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
