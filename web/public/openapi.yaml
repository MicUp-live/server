      required:
      - detail
      - step
      - deleting
      properties:
        detail:
          type: string
          example: account deletion incomplete; retry to finish cleanup
        step:
          type: string
          description: Cascade boundary where deletion paused.
          example: purge_catalog_version
        deleting:
          type: boolean
          example: true
        deletion_token:
          type: string
          description: Scoped JWT recovery token authorizing retry of DELETE /auth/me for this account.
  responses:
    BadRequest:
      description: Invalid request parameters or payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InsufficientScope:
      description: Developer key lacks the required route scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InsufficientScope'
    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource conflict (e.g. email already registered, max active singer
        limit reached)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AccountDeletionIncomplete:
      description: |
        Account deletion began and revoked credentials, but a downstream cleanup
        step failed. Retry DELETE /auth/me with the returned X-Deletion-Token
        (or wait for background/operator recovery) to complete cleanup.
      headers:
        X-Deletion-Token:
          description: Scoped JWT recovery token for retrying DELETE /auth/me.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountDeletionPartialFailure'
    EventMutationConflict:
      description: |
        The server's event snapshot became stale or restart fenced the update.
        This attempt did not commit its event settings/key or rotation plan.
        Reload the event and queue, then resubmit the intended fields. The error
        uses queue_version_conflict and includes the server snapshot's expected
        and current queue versions. These versions can be equal when private
        metadata changed without a public queue bump; matching queue versions
        alone are not a reason to replay the obsolete plan. The metadata version
        is internal and is not a client precondition. This response does not add
        idempotency support to event settings, status, restart, or key rotation.
      headers:
        X-Queue-Version:
          description: Current public queue version; reload event state before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/QueueVersionConflict'
    QueueMutationConflict:
      description: The queue was stale or the idempotency key was reused for a different mutation; no mutation was applied.
      headers:
        X-Queue-Version:
          description: Current queue version to use for a retry, when available.
          schema:
            type: integer
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/QueueVersionConflict'
            - $ref: '#/components/schemas/IdempotencyConflict'
