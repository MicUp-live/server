  /events/{id}/restart:
    post:
      tags:
      - Events
      summary: Restart event and archive queue
      description: A restart without clearing the queue conditionally commits its event snapshot; a stale snapshot returns 409. Clearing restarts retain their bounded, resumable archival workflow.
      security:
      - DeveloperKeyAuth: []
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Event restarted and queue cleared
        '409':
          $ref: '#/components/responses/EventMutationConflict'

  /events/{id}/openkj-key/rotate:
    post:
      tags:
      - Events
      summary: Rotate OpenKJ integration secret key
      description: Key rotation changes private event metadata without advancing the public queue version. A concurrent event/queue change can reject the rotation with 409.
      security:
      - DeveloperKeyAuth: []
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: New OpenKJ key generated
        '409':
          $ref: '#/components/responses/EventMutationConflict'

  /join/{code}:
