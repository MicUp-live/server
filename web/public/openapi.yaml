                      $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientScope'
    post:
      tags:
      - Events
      summary: Create an event
      security:
      - DeveloperKeyAuth: []
